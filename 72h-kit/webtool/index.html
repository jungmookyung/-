<title>AI 업무지시서 생성기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#16181d; --sub:#5b616e;
    --line:#e6e8ec; --brand:#e8552d; --brand-ink:#fff; --accent:#111318;
    --code-bg:#0f1115; --code-ink:#e8eaf0;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0d0f13; --card:#161922; --ink:#eef0f5; --sub:#a2a9b8;
      --line:#262b36; --brand:#ff6a3d; --accent:#eef0f5; --code-bg:#0a0c10; }
  }
  :root[data-theme="dark"]{ --bg:#0d0f13; --card:#161922; --ink:#eef0f5; --sub:#a2a9b8; --line:#262b36; --brand:#ff6a3d; --accent:#eef0f5; --code-bg:#0a0c10; }
  :root[data-theme="light"]{ --bg:#f6f7f9; --card:#ffffff; --ink:#16181d; --sub:#5b616e; --line:#e6e8ec; --brand:#e8552d; --accent:#111318; --code-bg:#0f1115; --code-ink:#e8eaf0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 64px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 20px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  .tag{display:inline-block;background:var(--brand);color:var(--brand-ink);
    font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  p.lede{color:var(--sub);margin:0 0 18px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  .hint{color:var(--sub);font-weight:400;font-size:12px;margin-left:4px}
  input,textarea,select{width:100%;background:transparent;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:52px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{cursor:pointer;border:none;border-radius:9px;font-size:14px;font-weight:600;padding:10px 14px;font-family:inherit}
  .primary{background:var(--brand);color:#fff}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .out{background:var(--code-bg);color:var(--code-ink,#e8eaf0);border-radius:12px;
    padding:16px;white-space:pre-wrap;word-break:break-word;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px}
  .bartop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .bartop h2{font-size:14px;margin:0}
  .copied{color:var(--brand);font-size:12px;font-weight:700;opacity:0;transition:opacity .2s}
  .copied.on{opacity:1}
  footer{color:var(--sub);font-size:12px;margin-top:26px;text-align:center}
  .themebtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px}
</style>

<div class="wrap">
  <header>
    <h1>AI 업무지시서 생성기<span class="tag">역·맥·작·형·완</span></h1>
    <button class="themebtn" id="theme">◐ 테마</button>
  </header>
  <p class="lede">5가지 요소만 채우면, AI가 잘 알아듣는 업무지시서(프롬프트)를 만들어 드립니다. 아래 예시를 고르면 자동으로 채워집니다.</p>

  <div class="grid">
    <div class="card">
      <label>예시 불러오기 <span class="hint">— 고르면 아래가 채워집니다</span></label>
      <select id="preset">
        <option value="">— 직접 입력 —</option>
      </select>

      <label>① 역할 <span class="hint">누구처럼 일하나</span></label>
      <input id="role" placeholder="예) 10년차 고객상담 팀장">

      <label>② 맥락 <span class="hint">무슨 상황인가</span></label>
      <textarea id="context" placeholder="예) 수제 캔들을 파는 온라인 쇼핑몰의 환불 문의"></textarea>

      <label>③ 작업 <span class="hint">정확히 뭘 하나 (하나만)</span></label>
      <textarea id="task" placeholder="예) 규정을 지키는 정중한 답변 초안 작성"></textarea>

      <label>④ 형식 <span class="hint">길이·톤·구조</span></label>
      <textarea id="format" placeholder="예) 존댓말, 3문단, 250자 이내, 링크 금지"></textarea>

      <label>⑤ 완료 기준 <span class="hint">뭐가 합격인가</span></label>
      <textarea id="done" placeholder="예) 규정 위반 없음 + 다음 행동 1개 안내"></textarea>

      <label>붙일 내용(선택) <span class="hint">문의 원문·데이터 등</span></label>
      <textarea id="material" placeholder="예) 고객 문의 원문을 여기에"></textarea>

      <div class="row">
        <button class="primary" id="gen">지시서 만들기</button>
        <button class="ghost" id="clear">비우기</button>
      </div>
    </div>

    <div class="card">
      <div class="bartop">
        <h2>생성된 지시서</h2>
        <div class="row" style="margin:0;gap:8px;align-items:center">
          <span class="copied" id="copied">복사됨!</span>
          <button class="ghost" id="copy">복사</button>
        </div>
      </div>
      <div class="out" id="out">왼쪽을 채우고 "지시서 만들기"를 누르세요.</div>
    </div>
  </div>

  <footer>단일 HTML 파일 · 인터넷 없이 동작 · 본인 상품으로 자유롭게 재사용/재배포하세요.</footer>
</div>

<script>
  var PRESETS = [
    {name:"고객 문의 답변 초안", role:"10년차 고객상담 팀장",
     context:"[업종/제품]의 고객 문의에 답하는 상황",
     task:"아래 문의에 대한 답변 초안 작성",
     format:"존댓말, 3문단 이내, 250자 이내. 1문단 공감/사과 → 2문단 해결/안내 → 3문단 다음 행동 1개",
     done:"규정 위반 없음, 고객이 다음에 뭘 하면 되는지 명확함. 확실치 않은 정보는 [확인 필요] 표시",
     material:"[고객 문의 원문]"},
    {name:"환불·교환 안내(규정 준수)", role:"규정을 지키면서도 친절한 CS 담당자",
     context:"우리 환불 규정: [규정 요약 3줄]",
     task:"요청이 가능/부분가능/불가 중 무엇인지 한 줄로 판단 후, 그에 맞는 정중한 안내문 작성",
     format:"존댓말, 200자 이내. 금액/기한 등 숫자는 [ ]로 비워둘 것",
     done:"불가일 경우 대안 1개 반드시 제시",
     material:"[고객 요청 원문]"},
    {name:"SNS 게시글 초안", role:"전환율 높은 SNS 카피라이터",
     context:"타겟: [누구에게] / 알릴 내용: [주제]",
     task:"서로 다른 첫 문장(훅)으로 게시글 초안 3개 작성. 훅: 숫자·의외의 사실·공감 고백",
     format:"각 150자 이내, 해시태그 3개, 마지막 줄 행동유도 1문장. 링크는 [댓글 링크]로만 표시",
     done:"과장·허위 없음, 세 개의 훅이 서로 다름",
     material:""},
    {name:"회의록 요약 + 할 일", role:"꼼꼼한 회의 서기",
     context:"아래 회의 녹취/메모를 정리하는 상황",
     task:"3줄 요약 + 결정사항 목록 + 할 일 표(담당/할 일/기한) 작성",
     format:"발언자 불명확 시 [담당 미정] 표기",
     done:"할 일마다 담당과 기한이 지정됨",
     material:"[회의 녹취/메모]"},
    {name:"상세페이지 카피", role:"정직하게 잘 파는 카피라이터(과장·허위 금지)",
     context:"상품: [상품명 / 무엇을 해주는지] / 타겟 고민: [고민]",
     task:"문제 공감 → 해결(핵심 3가지) → 추천/비추천 → 시작하는 법 순서로 카피 작성",
     format:"소제목 있는 섹션. 근거 없는 '최고/1위' 표현 금지",
     done:"기대치가 정렬되고 행동 유도 1개가 명확함",
     material:""},
    {name:"데이터 표 정리", role:"데이터 정리 담당자",
     context:"아래 지저분한 데이터를 표로 정리하는 상황",
     task:"지정한 열로 표를 만들고 중복 행 제거",
     format:"열: [원하는 열 이름들]. 빈 값은 [빈칸] 유지, 임의로 채우지 말 것. 마크다운 표 + CSV 두 형식",
     done:"중복을 몇 개 제거했는지 알려줌",
     material:"[데이터 붙여넣기]"}
  ];

  var $ = function(id){ return document.getElementById(id); };
  var fields = ["role","context","task","format","done","material"];

  // presets 채우기
  var sel = $("preset");
  PRESETS.forEach(function(p,i){
    var o = document.createElement("option"); o.value=i; o.textContent=p.name; sel.appendChild(o);
  });
  sel.addEventListener("change", function(){
    if(sel.value==="") return;
    var p = PRESETS[+sel.value];
    fields.forEach(function(f){ $(f).value = p[f]||""; });
    generate();
  });

  function generate(){
    var role=$("role").value.trim(), context=$("context").value.trim(),
        task=$("task").value.trim(), format=$("format").value.trim(),
        done=$("done").value.trim(), material=$("material").value.trim();

    if(!role && !task){ $("out").textContent='왼쪽을 채우고 "지시서 만들기"를 누르세요.'; return; }

    var lines = [];
    lines.push(role ? ("당신은 "+role+"입니다.") : "당신은 유능한 실무 담당자입니다.");
    if(context) lines.push("상황: "+context);
    lines.push("");
    lines.push("[작업]");
    lines.push(task || "아래 내용을 처리하세요.");
    lines.push("");
    if(format){ lines.push("[형식]"); lines.push(format); lines.push(""); }
    if(done){ lines.push("[완료 기준]"); lines.push(done); lines.push(""); }
    if(material){ lines.push("[대상 내용]"); lines.push(material); lines.push(""); }
    lines.push("확실하지 않은 부분은 지어내지 말고 [확인 필요]로 표시하세요.");
    $("out").textContent = lines.join("\n");
  }

  $("gen").addEventListener("click", generate);
  fields.forEach(function(f){ $(f).addEventListener("input", function(){
    if($("out").textContent.indexOf("당신은")===0) generate();
  }); });

  $("clear").addEventListener("click", function(){
    fields.forEach(function(f){ $(f).value=""; }); sel.value="";
    $("out").textContent='왼쪽을 채우고 "지시서 만들기"를 누르세요.';
  });

  $("copy").addEventListener("click", function(){
    var t = $("out").textContent;
    function ok(){ var c=$("copied"); c.classList.add("on"); setTimeout(function(){c.classList.remove("on");},1200); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(ok, fallback);
    } else { fallback(); }
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
      ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); ok();
    }
  });

  // 테마 토글
  $("theme").addEventListener("click", function(){
    var r=document.documentElement;
    var cur=r.getAttribute("data-theme");
    var next = cur==="dark" ? "light" : (cur==="light" ? "dark" :
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light":"dark"));
    r.setAttribute("data-theme", next);
  });
</script>
